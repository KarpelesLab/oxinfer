name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or PR) supersedes this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the AVX2 kernels, macOS (arm64) the NEON kernels and the Metal backend's build,
        # Windows the non-unix file paths.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The feature sets dependents use: none, oxideav-core types only, and the defaults.
      - name: Clippy (feature subsets)
        run: |
          cargo clippy --lib --no-default-features -- -D warnings
          cargo clippy --lib --no-default-features --features oxideav -- -D warnings
          cargo clippy --all-targets -- -D warnings

      - name: Test (all features)
        run: cargo test --release --all-features

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  cross:
    name: Cross-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios, wasm32-wasip1, wasm32-wasip1-threads]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy (CPU-only build)
        run: cargo clippy --release --lib --no-default-features --target ${{ matrix.target }} -- -D warnings
      - name: Clippy (oxideav-core types only)
        run: cargo clippy --release --lib --no-default-features --features oxideav --target ${{ matrix.target }} -- -D warnings
      - name: Check (default features)
        if: ${{ !startsWith(matrix.target, 'wasm32') }}
        run: cargo check --release --target ${{ matrix.target }}

  web:
    name: Browser module and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Clippy (web feature)
        run: cargo clippy --release --lib --no-default-features --features web --target wasm32-unknown-unknown -- -D warnings
      - name: Build oxinfer.wasm
        run: |
          cargo build-web
          cp target/wasm32-unknown-unknown/release/oxinfer.wasm web/public/oxinfer.wasm
          ls -la web/public/oxinfer.wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Smoke test and build the site
        working-directory: web
        run: |
          npm ci
          npm run smoke
          npm run build
